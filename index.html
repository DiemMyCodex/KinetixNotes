      content="36 bài học vi mô về Máy tính, Trí tuệ AI, Tâm lý & Sống và Kinh tế — kèm ôn tập chủ động để kiến thức thực sự nằm lại."

    <meta name="twitter:title" content="KinetixNotes — Đọc ít hơn, nhớ lâu hơn" />

      name="twitter:description"
      content="Tủ sách vi mô về Máy tính, Trí tuệ AI, Tâm lý & Sống và Kinh tế, kèm ôn tập chủ động."
    />

    <style>
      html {
        background-color: #faf9f6;
      }
      html.dark {
        background-color: #0c0d0f;
      }
      #root:empty {
        min-height: 60vh;
      }
    </style>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kinetix-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0c0d0f');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        KinetixNotes cần JavaScript để hiển thị tủ sách. Vui lòng bật JavaScript và tải lại trang.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
